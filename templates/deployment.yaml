apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "web-service.fullname" . }}
  labels:
    app.kubernetes.io/name: {{ .Chart.Name }}
spec:
  {{- $replicaCount := .Values.replicaCount }}
  replicas: {{ $replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ .Chart.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ .Chart.Name }}
    spec:
      containers:
        - name: nginx
          {{- with .Values.image }}
          image: "{{ .repository }}:{{ .tag }}"
          {{- end }}
          ports:
            - name: http
              containerPort: 80
              protocol: TCP
